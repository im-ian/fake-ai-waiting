<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake AI Working Screen — 일하는 척 하기</title>
<meta name="description" content="Codex / Claude Code / Gemini CLI / Grok CLI 화면을 흉내내는 장난용 가짜 AI 작업 화면.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="config">
  <header>
    <div class="titlerow">
      <h1>Fake AI Working Screen</h1>
      <a class="gh" href="https://github.com/im-ian/fake-ai-waiting" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-2.92-.89-2.92-2.85 0-.68.24-1.24.64-1.68-.06-.2-.28-.82.06-1.7 0 0 .68-.22 2.23.82a7.5 7.5 0 0 1 2.03-.27c.69 0 1.38.09 2.03.27 1.55-1.05 2.23-.82 2.23-.82.34.88.12 1.5.06 1.7.4.44.64 1 .64 1.68 0 1.97-1.15 2.65-2.93 2.85.3.26.56.76.56 1.54 0 1.11-.01 2.01-.01 2.28 0 .21.15.46.55.38A7.99 7.99 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        GitHub
      </a>
    </div>
    <p class="sub">테마와 시간을 고르고 시작하면 AI CLI 가 열심히 일하는 화면이 재생됨.<br>
      아무 말이나 타이핑하고 <kbd>Enter</kbd> = 메시지 큐에 적립 → 작업 끝나면 받아서 이어감.
      <kbd>Esc</kbd> = 인터럽트, <kbd>Esc</kbd> <kbd>Esc</kbd> = 종료.</p>
  </header>

  <section class="field">
    <label>테마</label>
    <div class="cards" id="pick-theme"></div>
  </section>

  <section class="row">
    <div class="field">
      <label>재생 시간</label>
      <div class="chips" id="pick-dur">
        <button data-val="60">1분</button>
        <button data-val="300">5분</button>
        <button data-val="600" class="on">10분</button>
        <button data-val="1800">30분</button>
        <button data-val="3600">60분</button>
        <button data-val="0">무한</button>
      </div>
    </div>
    <div class="field">
      <label>타이핑 속도</label>
      <div class="chips" id="pick-speed">
        <button data-val="42">느림</button>
        <button data-val="24" class="on">보통</button>
        <button data-val="13">빠름</button>
        <button data-val="6">아주 빠름</button>
      </div>
    </div>
  </section>

  <section class="row">
    <div class="field">
      <label>시나리오</label>
      <select id="pick-scenario"></select>
    </div>
    <div class="field">
      <label>연출</label>
      <div class="checks">
        <label class="check"><input type="checkbox" id="opt-fs" checked> 전체화면으로 시작</label>
        <label class="check"><input type="checkbox" id="opt-effort" checked> effort 로딩 연출 (긴 대기)</label>
      </div>
    </div>
  </section>

  <button id="start">시작</button>
  <p class="foot">전부 가짜다. 네트워크 요청 없음, 서버 없음, 저장되는 건 브라우저에 남는 설정뿐.</p>
</main>

<div id="stage" hidden>
  <div id="top"></div>
  <div id="out"></div>
  <div id="bottom"></div>
  <div id="hint">타이핑 + <kbd>Enter</kbd> 큐 · <kbd>Esc</kbd> 인터럽트 · <kbd>Esc</kbd><kbd>Esc</kbd> 종료</div>
</div>

<script src="themes.js"></script>
<script src="scenarios.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
